<div class="Profesor-list">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Gestión de Profesors</h2>
      <button class="btn btn-success" (click)="openCreateModal()">
        Nuevo Profesor
      </button>
    </div>
    
    <div class="card-body">
      <!-- Filtros -->
      <div class="filters mb-3">
        <div class="row">
          <div class="col-md-4">
            <input 
              type="text" 
              class="form-control" 
              placeholder="Buscar por nombre..."
              [(ngModel)]="filters.nombre"
              (input)="onFilterChange()"
            >
          </div>
          <div class="col-md-3">
            <select 
              class="form-control" 
              [(ngModel)]="filters.activa"
              (change)="onFilterChange()"
            >
              <option value="">Todos los estados</option>
              <option value="true">Activas</option>
              <option value="false">Inactivas</option>
            </select>
          </div>
          <div class="col-md-2">
            <button class="btn btn-secondary" (click)="clearFilters()">
              Limpiar
            </button>
          </div>
        </div>
      </div>

      <!-- Tabla de Profesors -->
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="loading">
              <td colspan="6" class="text-center">Cargando...</td>
            </tr>
            <tr *ngIf="!loading && Profesor.length === 0">
              <td colspan="6" class="text-center">No hay Profesors disponibles</td>
            </tr>
            <tr *ngFor="let Profesor of Profesor">
              <td>{{ Profesor.id }}</td>
              <td>{{ Profesor.nombre }}</td>
              <td>{{ Profesor.apellido }}</td>
              <td>{{ Profesor.email }}</td>
              <td>
                <button class="btn btn-sm btn-primary" (click)="editProfesors(Profesor)">
                  Editar
                </button>
                <button class="btn btn-sm btn-danger" (click)="deleteProfesor(Profesor)">
                  Eliminar
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Paginación -->
      <div class="pagination mt-3" *ngIf="totalPages > 1">
        <button 
          class="btn btn-secondary" 
          [disabled]="currentPage === 1"
          (click)="goToPage(currentPage - 1)"
        >
          Anterior
        </button>
        <span class="mx-3">
          Página {{ currentPage }} de {{ totalPages }}
        </span>
        <button 
          class="btn btn-secondary" 
          [disabled]="currentPage === totalPages"
          (click)="goToPage(currentPage + 1)"
        >
          Siguiente
        </button>
      </div>
    </div>
  </div>

  <!-- Modal para crear/editar Profesor -->
  <div class="modal fade" [class.show]="showModal" [style.display]="showModal ? 'block' : 'none'" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ editingProfesor ? 'Editar Profesor' : 'Nuevo Profesor' }}</h5>
          <button type="button" class="close" (click)="closeModal()">
            <span>&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form (ngSubmit)="saveProfesor()">
            <div class="form-group">
              <label for="nombre">Nombre *</label>
              <input 
                type="text" 
                class="form-control" 
                id="nombre" 
                [(ngModel)]="ProfesorForm.nombre" 
                name="nombre"
                required
                placeholder="Ingrese el nombre de el Profesor"
              >
            </div>
            <div class="form-group">
              <label for="apellido">Apellido</label>
              <textarea 
                class="form-control" 
                id="apellido" 
                [(ngModel)]="ProfesorForm.apellido" 
                name="apellido"
                rows="3"
                placeholder="Ingrese un apellido (opcional)"
              ></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancelar</button>
          <button type="button" class="btn btn-primary" (click)="saveProfesor()">
            {{ editingProfesor ? 'Actualizar' : 'Crear' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
